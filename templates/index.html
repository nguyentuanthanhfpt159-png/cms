<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHARMA AI DASHBOARD PRO</title>
    <style>
        /* PHONG CÁCH PREMIUM - DARK MODE GLASSMORPHISM */
        :root {
            --bg: #0b0f19;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --accent: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a, var(--bg));
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 20px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* TRẠNG THÁI ĐÈN */
        .status-group {
            display: flex;
            gap: 15px;
        }

        .st-item {
            display: flex;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 10px;
            background: currentColor;
        }

        /* Bỏ hoàn toàn các hiệu ứng nhấp nháy và hào quang */

        /* NÚT ĐIỀU KHIỂN */
        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn {
            padding: 15px;
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            background: var(--glass);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn.active {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-color: #60a5fa;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-active {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        /* CARD THÔNG SỐ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--glass);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
        }

        .sc-total::after {
            background: var(--primary);
        }

        .sc-ok::after {
            background: var(--success);
        }

        .sc-ng::after {
            background: var(--danger);
        }

        .sc-stt::after {
            background: var(--warning);
        }

        .stat-label {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-val {
            font-size: 32px;
            font-weight: 800;
            margin-top: 10px;
            font-variant-numeric: tabular-nums;
        }

        /* BỐ CỤC CHÍNH */
        .main-layout {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 25px;
        }

        .section {
            background: var(--glass);
            padding: 20px;
            border-radius: 25px;
            border: 1px solid var(--glass-border);
        }

        .section-title {
            margin: 0 0 20px 0;
            font-size: 18px;
            display: flex;
            align-items: center;
            font-weight: 700;
        }

        /* GRID ẢNH LỖI */
        .img-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .img-box {
            aspect-ratio: 1;
            border-radius: 12px;
            border: 2px solid rgba(239, 68, 68, 0.2);
            overflow: hidden;
            position: relative;
            background: #000;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.3s;
        }

        .img-box:hover img {
            transform: scale(1.1);
        }

        .img-time {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.7);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* BẢNG NHẬT KÝ */
        .log-table {
            width: 100%;
            border-collapse: collapse;
        }

        .log-table th {
            text-align: left;
            color: #64748b;
            font-size: 12px;
            padding: 10px;
            border-bottom: 1px solid var(--glass-border);
        }

        .log-table td {
            padding: 12px 10px;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .st-ok {
            color: var(--success);
            font-weight: bold;
        }

        .st-ng {
            color: var(--danger);
            font-weight: bold;
        }

        /* ĐÁP ỨNG DI ĐỘNG */
        @media (max-width: 900px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .main-layout {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }

            .img-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="title-group">
            <h1>PHARMA MONITOR PRO</h1>
            <div style="font-size: 11px; color: #64748b; margin-top: 5px;">HỆ THỐNG GIÁM SÁT THỜI GIAN THỰC | SYNC:
                <span id="sync-time" style="color: #60a5fa;">--:--:--</span></div>
        </div>
        <div class="status-group">
            <div class="st-item"><span id="plc-dot" class="dot" style="color: #ef4444; background: #ef4444;"></span>
                PLC: <span id="plc-txt" style="color: #ef4444;">OFFLINE</span></div>
            <div class="st-item"><span id="cam-dot" class="dot" style="color: #ef4444; background: #ef4444;"></span>
                CAM: <span id="cam-txt" style="color: #ef4444;">OFFLINE</span></div>
        </div>
    </div>

    <div class="control-panel">
        <button id="btn-model-1" class="btn" onclick="setMode(1)">📦 Model: Viên rời</button>
        <button id="btn-model-2" class="btn" onclick="setMode(2)">💊 Model: Vỉ thuốc</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card sc-stt">
            <div class="stat-label">Hệ thống</div>
            <div id="val-status" class="stat-val" style="font-size: 20px; color: var(--warning);">STOPPED</div>
        </div>
        <div class="stat-card sc-total">
            <div class="stat-label">Tổng sản lượng</div>
            <div id="val-total" class="stat-val" style="color: var(--primary);">0</div>
        </div>
        <div class="stat-card sc-ok">
            <div class="stat-label">Sản phẩm đạt</div>
            <div id="val-ok" class="stat-val" style="color: var(--success);">0</div>
        </div>
        <div class="stat-card sc-ng">
            <div class="stat-label">Sản phẩm lỗi</div>
            <div id="val-ng" class="stat-val" style="color: var(--danger);">0</div>
        </div>
    </div>

    <!-- KHU VỰC BIỂU ĐỒ -->
    <div class="stats-grid" style="grid-template-columns: 2fr 1.2fr; margin-bottom: 25px;">
        <div class="section">
            <div class="section-title" style="color: var(--primary);">📈 SẢN LƯỢNG THEO GIỜ</div>
            <canvas id="lineChart" height="120"></canvas>
        </div>
        <div class="section">
            <div class="section-title" style="color: var(--warning);">📊 PHÂN TÍCH LOẠI LỖI</div>
            <canvas id="pieChart" height="180"></canvas>
        </div>
    </div>

    <div class="main-layout">
        <div class="section">
            <div class="section-title" style="color: var(--danger);">⚠ HÌNH ẢNH LỖI GẦN ĐÂY</div>
            <div id="img-grid" class="img-grid">
                <!-- Images via JS -->
            </div>
        </div>
        <div class="section">
            <div class="section-title" style="color: var(--primary);">📋 NHẬT KÝ KIỂM TRA</div>
            <table class="log-table">
                <thead>
                    <tr>
                        <th>LOẠI</th>
                        <th>KẾT QUẢ</th>
                        <th style="text-align:right">GIỜ</th>
                    </tr>
                </thead>
                <tbody id="log-body">
                    <!-- Logs via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let lineChart, pieChart;

        function initCharts() {
            try {
                if (typeof Chart === 'undefined') {
                    console.log("Không tải được Chart.js, bỏ qua khởi tạo biểu đồ.");
                    return;
                }
                const ctx1 = document.getElementById('lineChart').getContext('2d');
                lineChart = new Chart(ctx1, {
                    type: 'line',
                    data: {
                        labels: ['1h', '2h', '3h', '4h', '5h', '6h', '7h', '8h'],
                        datasets: [{
                            label: 'Sản phẩm',
                            data: [0, 0, 0, 0, 0, 0, 0, 0],
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            fill: true, tension: 0.4
                        }]
                    },
                    options: {
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } } }
                    }
                });

                const ctx2 = document.getElementById('pieChart').getContext('2d');
                pieChart = new Chart(ctx2, {
                    type: 'doughnut',
                    data: {
                        labels: ['Dị vật', 'Vỡ', 'Thiếu viên'],
                        datasets: [{
                            data: [1, 1, 1],
                            backgroundColor: ['#f59e0b', '#ef4444', '#8b5cf6'],
                            borderWidth: 0
                        }]
                    },
                    options: { cutout: '70%', plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', boxWidth: 10 } } } }
                });
            } catch (e) {
                console.log("Lỗi khởi tạo biểu đồ:", e);
            }
        }

        function setMode(id) {
            fetch('/api/set_model/' + id)
                .then(r => r.json())
                .then(res => {
                    if (res.status == "success") alert("Đã ra lệnh đổi Model thành công!");
                    else alert("Lỗi: " + res.message);
                });
        }

        function update() {
            fetch('/api/stats')
                .then(r => r.json())
                .then(d => {
                    document.getElementById('val-total').innerText = d.total;
                    document.getElementById('val-ok').innerText = d.ok;
                    document.getElementById('val-ng').innerText = d.ng;
                    document.getElementById('sync-time').innerText = d.last_sync;

                    const statusEl = document.getElementById('val-status');
                    statusEl.innerText = d.status;
                    statusEl.style.color = (d.status === "RUNNING") ? "#10b981" : "#ef4444";

                    // Cập nhật biểu đồ (Bao bọc trong try-catch để tránh lỗi nếu không có mạng)
                    try {
                        if (lineChart) {
                            if (d.hourly_labels) lineChart.data.labels = d.hourly_labels;
                            lineChart.data.datasets[0].data = d.hourly_data;
                            lineChart.update();
                        }
                        if (pieChart) {
                            pieChart.data.datasets[0].data = [d.error_types['Dị vật'], d.error_types['Vỡ'], d.error_types['Thiếu viên']];
                            pieChart.update();
                        }
                    } catch (e) {
                        console.log("Biểu đồ chưa sẵn sàng hoặc thiếu thư viện Chart.js");
                    }

                    // Cập nhật nút Model đang được chọn
                    const curModel = d.current_model;
                    document.querySelectorAll('.control-panel .btn').forEach(btn => btn.classList.remove('active'));
                    const activeBtn = document.getElementById(`btn-model-${curModel}`);
                    if (activeBtn) activeBtn.classList.add('active');

                    // Cập nhật trạng thái PLC (Tức thì)
                    const plcTxt = document.getElementById('plc-txt');
                    const plcDot = document.getElementById('plc-dot');
                    if (d.plc_connected) {
                        plcTxt.innerText = "ONLINE"; plcTxt.style.color = "#10b981";
                        plcDot.style.color = "#10b981"; plcDot.style.background = "#10b981";
                    } else {
                        plcTxt.innerText = "OFFLINE"; plcTxt.style.color = "#ef4444";
                        plcDot.style.color = "#ef4444"; plcDot.style.background = "#ef4444";
                    }

                    const camTxt = document.getElementById('cam-txt');
                    const camDot = document.getElementById('cam-dot');
                    if (d.cam_connected) {
                        camTxt.innerText = "ONLINE"; camTxt.style.color = "#10b981";
                        camDot.style.color = "#10b981"; camDot.style.background = "#10b981";
                    } else {
                        camTxt.innerText = "OFFLINE"; camTxt.style.color = "#ef4444";
                        camDot.style.color = "#ef4444"; camDot.style.background = "#ef4444";
                    }

                    const logBody = document.getElementById('log-body');
                    logBody.innerHTML = '';
                    d.recent_logs.forEach(log => {
                        const isNG = log[2].includes("LỖI");
                        logBody.innerHTML += `
                            <tr>
                                <td>${log[1]}</td>
                                <td class="${isNG ? 'st-ng' : 'st-ok'}">${log[2]}</td>
                                <td style="text-align:right">${log[3]}</td>
                            </tr>
                        `;
                    });
                })
                .catch(err => {
                    console.log("Không thể kết nối đến máy chủ:", err);
                    // Đặt trạng thái về OFFLINE nếu mất kết nối với web_dashboard
                    const plcTxt = document.getElementById('plc-txt');
                    const plcDot = document.getElementById('plc-dot');
                    plcTxt.innerText = "OFFLINE"; plcTxt.style.color = "#ef4444";
                    plcDot.style.color = "#ef4444"; plcDot.style.background = "#ef4444";

                    const camTxt = document.getElementById('cam-txt');
                    const camDot = document.getElementById('cam-dot');
                    camTxt.innerText = "OFFLINE"; camTxt.style.color = "#ef4444";
                    camDot.style.color = "#ef4444"; camDot.style.background = "#ef4444";

                    const statusEl = document.getElementById('val-status');
                    statusEl.innerText = "DISCONNECTED";
                    statusEl.style.color = "#ef4444";
                });

            fetch('/api/images')
                .then(r => r.json())
                .then(imgs => {
                    const grid = document.getElementById('img-grid');
                    grid.innerHTML = '';
                    imgs.forEach(img => {
                        grid.innerHTML += `
                            <div class="img-box">
                                <img src="/error_images/${img}">
                                <div class="img-time">${img.split('_')[1].substring(0, 4)}</div>
                            </div>
                        `;
                    });
                });
        }

        initCharts();
        setInterval(update, 2000);
        update();
    </script>
</body>

</html>
